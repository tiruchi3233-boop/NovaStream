<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStream</title>
    <meta name="google-site-verification" content="kNxp8lnhhzID0t0tn9CgH9aif86JnkdCEM_7nJGxUog" />
    <!-- CSS अलग फ़ाइल से लोड होगी -->
<link rel="stylesheet" href="style.css">
</head>
<body>

          <header>
    <div class="logo">✨ NovaStream</div>
    <div class="search-wrapper">
  <!-- 1. Search Icon -->
  <button id="searchTriggerBtn" class="search-trigger-btn" aria-label="Search">
    🔍
  </button>

  <!-- 2. Expandable Search Box Container -->
  <div class="search-container" id="searchContainer">
    <span class="search-icon-inside">🔍</span>
    
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search movies, books..." 
      autocomplete="off"
    />
    
    <!-- Clear (✖️) Button -->
    <span id="clearSearchBtn" class="clear-btn" title="Clear">&times;</span>
  </div>
</div>
  </header>
    <!-- Hero Section -->
<div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">Welcome to NovaStream</h1>
        <p class="hero-desc">Stream HD Movies & Read Unlimited Books Anytime, Anywhere.</p>
        <div class="hero-buttons">
            <button class="btn btn-primary">▶ Play Latest</button>
            <button class="btn btn-secondary">ℹ More Info</button>
        </div>
    </div>
</div>

    <!-- Movies Section -->
    <div class="section">
        <h2 class="section-title">🎬 Movies & Shows</h2>
        <div class="carousel" id="movies-container"></div>
    </div>

    <!-- Books Section -->
    <div class="section">
        <h2 class="section-title">📚 Books & PDFs</h2>
        <div class="carousel" id="books-container"></div>
    </div>
  <!-- Footer Section -->
  <footer>
    <div class="footer-links">
      <a href="mailto:tiruchi3233@gmail.com">Contact Us</a>
      <a href="javascript:void(0)" onclick="openLegalModal('terms')">Terms of Use</a>
<a href="javascript:void(0)" onclick="openLegalModal('privacy')">Privacy Policy</a> 
    </div>
    <p class="footer-copy">© 2026 NovaStream. All rights reserved.</p>
  </footer>
<!-- Legal Notice Modal -->
<div id="legal-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#181818; color:#fff; padding:25px; border-radius:10px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; position:relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
    <button onclick="closeLegalModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
    <h2 id="legal-title" style="margin-top:0; color:#e50914;"></h2>
    <hr style="border-color:#333; margin-bottom:15px;">
    <div id="legal-content" style="line-height:1.6; font-size:14px; color:#ccc;"></div>
  </div>
</div>

    <!-- दोनों स्क्रिप्ट्स अलग-अलग लोड होंगी -->
    <script src="movies.js"></script>
     <script src="books.js"></script>
</body>
</html>
