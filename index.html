    <div style="display: flex; align-items: center; gap: 12px;">
      <!-- Mobile Menu Toggle Button -->
      <button onclick="toggleMenu()" style="background: none; border: none; color: white; font-size: 22px; cursor: pointer;">☰</button>
      <div class="logo">✨ NovaStream</div>
    </div>

    <!-- Navigation Menu Links -->
    <nav id="navLinks" class="nav-menu">
      <a href="#">Home</a>
      <a href="#movies-container">Movies & Shows</a>
      <a href="#books-container">Books & PDFs</a>
    </nav>

    <!-- Search Icon -->
    <div class="search-wrapper" style="position: relative; display: flex; align-items: center;">
      <button id="searchTriggerBtn" class="search-trigger-btn" style="background: transparent; border: none; color: white;">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <div id="searchContainer" class="search-container">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search movies, books..." autocomplete="off">
        <span id="clearSearchBtn" class="clear-btn">&times;</span>
      </div>

      <div id="searchDropdown" class="search-dropdown" style="display: none; position: absolute; top: 100%; right: 0;"></div>
    </div>
  </header>
    <!-- Hero Section -->
<div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">Welcome to NovaStream</h1>
        <p class="hero-desc">Stream HD Movies & Read Unlimited Books Anytime, Anywhere.</p>
        <div class="hero-buttons">
            <button class="btn btn-primary">▶ Play Latest</button>
            <button class="btn btn-secondary">ℹ More Info</button>
        </div>
    </div>
</div>

    <div class="section">
        <h2 class="section-title">🎬 Movies & Shows</h2>
        <div class="carousel" id="movies-container"></div>
    </div>

    <!-- Books Section -->
    <div class="section">
        <h2 class="section-title">📚 Books & PDFs</h2>
        <div class="carousel" id="books-container"></div>
    </div>
  <!-- Footer Section -->

<a href="javascript:void(0)" onclick="openLegalModal('privacy')">Privacy Policy</a>

<!-- Legal Notice Modal -->

  <div style="background:#181818; color:#fff; padding:25px; border-radius:10px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; position:relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">

<script>
