<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStream</title>
    <!-- CSS अलग फ़ाइल से लोड होगी -->
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <header>
        <div class="logo">✨ NovaStream</div>
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search...">
        </div>
    </header>

    <!-- Hero Section -->
<div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">Welcome to NovaStream</h1>
        <p class="hero-desc">Stream HD Movies & Read Unlimited Books Anytime, Anywhere.</p>
        <div class="hero-buttons">
            <button class="btn btn-primary">▶ Play Latest</button>
            <button class="btn btn-secondary">ℹ More Info</button>
        </div>
    </div>
</div>

    <!-- Movies Section -->
    <div class="section">
        <h2 class="section-title">🎬 Movies & Shows</h2>
        <div class="carousel" id="movies-container"></div>
    </div>

    <!-- Books Section -->
    <div class="section">
        <h2 class="section-title">📚 Books & PDFs</h2>
        <div class="carousel" id="books-container"></div>
    </div>

    <!-- दोनों स्क्रिप्ट्स अलग-अलग लोड होंगी -->
    <script src="movies.js"></script>
    <script src="books.js"></script>
</body>
</html>
